<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canyons Interview Flashcards — Tim Wright</title>
<style>
:root{--bg:#0b0d12;--panel:#151922;--line:#262c3a;--txt:#eef1f6;--mut:#9aa3b5;--red:#ff3b3b;--grn:#2ecc71;--amb:#ffb020;--blu:#4da3ff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#1a2030,var(--bg));color:var(--txt);font:18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#0e1118;flex-wrap:wrap}
.onair{display:inline-flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.12em;font-size:13px;color:#fff;background:var(--red);padding:5px 10px;border-radius:4px;box-shadow:0 0 18px rgba(255,59,59,.55)}
.onair i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
h1{font-size:16px;margin:0;font-weight:600;color:var(--mut);flex:1;min-width:180px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 0;justify-content:center}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--mut);padding:8px 14px;border-radius:999px;font-size:15px;cursor:pointer}
.tab.on{color:#fff;border-color:var(--blu);background:#13223a}
.bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 16px;flex-wrap:wrap;color:var(--mut);font-size:15px}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.tc{font-family:ui-monospace,Menlo,Consolas,monospace;background:#000;color:var(--amb);padding:4px 10px;border-radius:4px;border:1px solid #332a10;font-size:15px}
.prog{height:4px;background:var(--line);margin:0 16px;border-radius:4px;overflow:hidden}
.prog>div{height:100%;background:linear-gradient(90deg,var(--grn),var(--blu));width:0;transition:width .3s}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;perspective:1600px}
.card{position:relative;width:min(920px,100%);min-height:min(60vh,520px);cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(180deg,#181d28,#11151d);border:1px solid var(--line);border-radius:18px;padding:28px 30px 24px;display:flex;flex-direction:column;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.back{transform:rotateY(180deg);border-color:#24456e}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;gap:8px}
.pill{padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.pill.got{color:var(--grn);border-color:#1f6b40}.pill.rev{color:var(--amb);border-color:#6b4f12}
.front .q{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(24px,4.2vw,40px);font-weight:700;line-height:1.25}
.hint{text-align:center;color:var(--mut);font-size:14px;margin-top:12px}
ul{margin:0;padding-left:1.1em;font-size:clamp(18px,2.4vw,24px)}
li{margin:.35em 0}li::marker{color:var(--red)}
li.say{list-style:none;margin-left:-1.1em;padding:10px 14px;border-left:4px solid var(--blu);background:#0f1a2b;border-radius:6px;margin-bottom:.6em}
li.say2{list-style:none;margin-left:-1.1em;padding:10px 14px;border-left:4px solid var(--red);background:#2a1215;border-radius:6px;font-style:italic}
.bq{font-size:clamp(18px,2.6vw,26px);font-weight:600}
.backq{font-size:15px;color:var(--mut);margin-bottom:10px}
.controls{display:flex;gap:10px;justify-content:center;padding:6px 16px 18px;flex-wrap:wrap}
button.b{font:inherit;font-size:17px;padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;min-width:64px}
button.b:hover{border-color:#3a4458}button.b:active{transform:translateY(1px)}
button.got{border-color:#1f6b40;color:var(--grn)}button.rev{border-color:#6b4f12;color:var(--amb)}
button.small{font-size:14px;padding:7px 12px}
.empty{text-align:center;color:var(--mut);font-size:20px}
footer{text-align:center;color:#5c6578;font-size:12px;padding:0 0 14px}
@media (max-width:600px){.face{padding:20px 18px}button.b{padding:12px 14px;font-size:16px}h1{font-size:14px}}
</style></head><body>
<header><span class="onair"><i></i>ON AIR</span><h1>Canyons Interview Flashcards — Tim Wright · Broadcast and Video Production Instructor</h1>
<button class="b small" id="resetBtn" title="Clear Got it / Review marks">Reset marks</button></header>
<nav class="tabs" id="tabs"></nav>
<div class="bar">
 <span class="tc" id="counter">00 / 00</span>
 <span id="stats"></span>
 <label><input type="checkbox" id="reviewOnly"> Review-only</label>
 <button class="b small" id="shuffleBtn">⇄ Shuffle</button>
 <button class="b small" id="orderBtn">↺ In order</button>
</div>
<div class="prog"><div id="progFill"></div></div>
<main><div class="card" id="card" tabindex="0" aria-live="polite">
 <div class="face front"><div class="meta"><span id="fDeck"></span><span id="fMark"></span></div><div class="q" id="fText"></div><div class="hint">Tap / click / Space to flip</div></div>
 <div class="face back"><div class="meta"><span id="bDeck"></span><span id="bMark"></span></div><div class="backq" id="bQ"></div><ul id="bList"></ul></div>
</div></main>
<div class="controls">
 <button class="b" id="prevBtn" aria-label="Previous">◀ Prev</button>
 <button class="b" id="flipBtn">Flip</button>
 <button class="b rev" id="revBtn">↻ Review again</button>
 <button class="b got" id="gotBtn">✓ Got it</button>
 <button class="b" id="nextBtn" aria-label="Next">Next ▶</button>
</div>
<footer>Keys: ←/→ navigate · Space/Enter flip · G got it · R review again · S shuffle</footer>
<script>
const CARDS=[{"id": "A1", "deck": "Interview Questions", "front": "Why this role — and why the Canyons Innovation Center now?", "back": ["Real client work → real pathway: profession-based model, a deliverable, not a worksheet", "Class time = production time; students crew real jobs with real deadlines", "Design year (2026-27) = build curriculum, workflow & templates before students arrive Fall 2027", "CSDtv's Emmy-level bar is the standard I want students held to", "My mix fits: acting + AI video + client work + community media"], "style": "cues"}, {"id": "A2", "deck": "Interview Questions", "front": "How do you balance teaching vs. directing?", "back": ["\"I direct on set, I teach in the debrief.\"", "Gradual release: I do → we do → you do; crew roles rotate (producer, director, DP, A1, editor)", "Checkpoints: pitch → treatment → shot list → rough → fine → client approval", "Rubric-based critique; formative checks along the way, summative = portfolio"], "style": "cues"}, {"id": "A3", "deck": "Interview Questions", "front": "Walk us through a client project from intake to delivery.", "back": ["Discovery call → creative brief (goals, audience, deliverables, timeline, budget) → scope sign-off", "Pre-pro: treatment, script, storyboard, shot list, talent/location releases", "Production: call sheet, slate, B-roll, room tone", "Post: rough cut → Frame.io review → fine cut → picture lock → color/mix → captions → platform deliverables", "Delivery + analytics debrief. Example: Arrive Home English/Spanish avatar videos w/ revision rounds"], "style": "cues"}, {"id": "A4", "deck": "Interview Questions", "front": "A client deadline is collapsing. What do you do?", "back": ["Triage: is it in scope, or is it a change order?", "Phased delivery: ship v1 now, polish later", "Production meeting: reassign roles, cut nice-to-haves, protect the core deliverable", "Teach scope creep as a lesson; update the template so it doesn't repeat"], "style": "cues"}, {"id": "A5", "deck": "Interview Questions", "front": "How would you run a live / sports broadcast with students?", "back": ["Multi-cam, switcher (ATEM/TriCaster), TD, director calling shots, graphics, replay, A1", "Rundown, camera plot, IFB/comms check, stream test, backup encoder", "Call it clean: \"Ready camera 2… take 2.\" \"Standby graphics.\"", "Dress rehearsal; slate/bumper ready for dead air; redundant audio"], "style": "cues"}, {"id": "A6", "deck": "Interview Questions", "front": "Where does AI fit in the curriculum?", "back": ["Real use: HeyGen avatars, Runway, AI voice/translation (Arrive Home Spanish versions)", "\"AI is a tool — judgment is the skill.\"", "Ethics: disclosure, copyright/licensing, consent, fact-checking", "AI for pre-pro & edit assists, then a human pass; follow district AUP + FERPA"], "style": "cues"}, {"id": "A7", "deck": "Interview Questions", "front": "What would your first 90 days look like?", "back": ["Embed with CSDtv; interview advisory/industry partners", "Map Utah CTE Digital Media/Broadcasting standards → scope & sequence via backward design", "Build starter projects, client-brief templates, rubrics, capstone scaffold; give studio-spec input", "Pilot with the CSDtv evening class → ready for Fall 2027 deliverables"], "style": "cues"}, {"id": "A8", "deck": "Interview Questions", "front": "How would you work with other CIC pathways?", "back": ["Other pathways = our first clients (healthcare promos, construction time-lapses, business pitches)", "Intake form + shared production calendar", "Co-plan through PLCs; safe place to practice client relations", "Capstone screenings to showcase the work"], "style": "cues"}, {"id": "A9", "deck": "Interview Questions", "front": "How do you teach social media / creator content?", "back": ["TikTok / Reels / Shorts / YouTube; vertical 9:16", "2-second hook, retention curve, watch time, A/B thumbnails, captions for sound-off", "Content calendar + weekly analytics review", "Creator culture, personal brand, FTC disclosure — I run my own YouTube channel"], "style": "cues"}, {"id": "A10", "deck": "Interview Questions", "front": "How do you mentor a struggling or disengaged student?", "back": ["Relationship first, then rigor", "Give them a winnable role on the crew", "Chunked goals and regular check-ins", "Differentiate and scaffold — but keep the bar; loop in parents early, counselors as needed"], "style": "cues"}, {"id": "A11", "deck": "Interview Questions", "front": "How do you handle safety and equipment management?", "back": ["Checkout contracts, barcode sign-out, regular inventory audits", "Safety before access: sandbags, over-under cable management, ladder/grid rules, hot lights", "Field shoots: permission slips, location releases, supervision", "Visible production board; \"treat it like client gear.\""], "style": "cues"}, {"id": "A12", "deck": "Interview Questions", "front": "Coming from industry — how will you handle classroom management & school systems?", "back": ["Routines & procedures; production roles ARE the management system", "CSD instructional framework, standards-based grading, portfolio assessment", "Parent updates, showcase nights; IEPs/504s/ELL supports, UDL", "PLCs, mentoring, CTESS, licensure/endorsement — I'm on the licensed route"], "style": "cues"}, {"id": "B1", "deck": "Experience Statements", "front": "Your studio-building experience", "back": ["I've built a student studio from bare walls to broadcast.", "At Granger High School I built the GTV studio and the Advanced Video Production studio and lab.", "So when CIC talks about a working production house, I know what it takes to stand one up."], "style": "say"}, {"id": "B2", "deck": "Experience Statements", "front": "Your measure of success", "back": ["My measure of success is where my students end up.", "Shara Park is a great example — today she anchors midday news at KSL and has several regional Emmys.", "That's the bar I want every student to see is possible."], "style": "say"}, {"id": "B3", "deck": "Experience Statements", "front": "Your track record with students", "back": ["I have a track record of students going on to excellence.", "Shara Park — now a KSL anchor on the midday news with several regional Emmys — is one example of where that can lead."], "style": "say"}, {"id": "B4", "deck": "Experience Statements", "front": "Your enterprise / client-facing technical work", "back": ["I approved the specs for Merit Medical's European hub training center.", "Then I spent a week on-site training their team to use the technology effectively.", "I don't just spec gear — I make sure the people using it are confident."], "style": "say"}, {"id": "B5", "deck": "Experience Statements", "front": "Why you'd be your own tier-1 tech support", "back": ["I don't just produce the show — I keep it on the air.", "I want to be first-line tech support so a production keeps running instead of waiting days for a vendor.", "That keeps class time as production time."], "style": "say"}, {"id": "B6", "deck": "Experience Statements", "front": "Your troubleshooting fluency", "back": ["I'm fluent troubleshooting PTZ cameras, Blackmagic ATEM switchers like the ATEM Mini Extreme, Blackmagic studio cameras, pedestal cameras, teleprompters [teleprompter model], and NDI-based workflows.", "If it's in the signal chain, I can trace it."], "style": "say"}, {"id": "B7", "deck": "Experience Statements", "front": "Working alongside CSDtv", "back": ["CSDtv already produces at a professional level — I can plug into that on day one.", "I can run a switcher, chase down an NDI problem, and train a crew, so the design year is spent building, not waiting."], "style": "say"}, {"id": "B8", "deck": "Experience Statements", "front": "Training adults vs. training students", "back": ["I've trained a corporate team at Merit Medical's European hub in a week, and I've trained high school crews in the studios I built at Granger.", "The method is the same: hands on the gear, clear steps, and confidence before speed."], "style": "say"}, {"id": "B9", "deck": "Experience Statements", "front": "Bringing the studio spec to life at CIC", "back": ["I've been on both sides of a studio build — spec'ing it, as with Merit Medical, and building it, as with Granger's GTV and Advanced Video Production lab.", "I'd love to give input on the CIC studio so it's built for how students actually work."], "style": "say"}, {"id": "B10", "deck": "Experience Statements", "front": "Closing line / why hire me", "back": ["I've built student studios, I've sent students to the anchor desk, and I can keep a live show on the air.", "I'd bring all three to the Canyons Innovation Center."], "style": "say"}, {"id": "C1", "deck": "Tech & Troubleshooting", "front": "PTZ camera not responding to the controller", "back": ["Check power/PoE: link lights, PoE budget on the switch, try a known-good cable/port", "Power-cycle the camera first, then the controller/joystick", "Verify IP address & subnet match the controller; no IP conflicts", "Confirm the control protocol matches: VISCA over IP (port/ID) vs. NDI|HX control", "Check firmware on camera and controller; update only between productions", "Say: \"I start at power and work up the stack — power, network, protocol, firmware.\""], "style": "cues"}, {"id": "C2", "deck": "Tech & Troubleshooting", "front": "NDI basics: NDI vs. NDI|HX", "back": ["Full NDI: low-latency, lightly compressed; ~100+ Mbps per 1080p stream — needs gigabit", "NDI|HX (H.264/H.265): far lower bandwidth, slightly more latency — common on PTZs", "Discovery via mDNS on one subnet; NDI Discovery Server for multi-subnet/large networks", "Unicast by default; multicast for one-to-many (needs IGMP configured)", "Say: \"NDI turns the network into the video router — so the network has to be built for it.\""], "style": "cues"}, {"id": "C3", "deck": "Tech & Troubleshooting", "front": "NDI source not showing up", "back": ["Same subnet/VLAN? mDNS doesn't cross routers — use NDI Discovery Server", "Firewall on the PC blocking NDI ports? Check groups/access manager settings", "Confirm the source is actually sending (NDI Studio Monitor / Tools)", "Say: \"If you can't see it, it's usually discovery, not the camera.\""], "style": "cues"}, {"id": "C4", "deck": "Tech & Troubleshooting", "front": "Network settings for AV over IP", "back": ["Gigabit (or faster) managed switches", "QoS to prioritize video/audio traffic", "IGMP snooping + an IGMP querier for multicast so streams don't flood every port", "VLAN separation of AV traffic from general school network", "Jumbo frames: caution — only if every device end-to-end supports it", "Say: \"I'd partner with district IT early so the AV VLAN is designed, not discovered.\""], "style": "cues"}, {"id": "C5", "deck": "Tech & Troubleshooting", "front": "ATEM Mini Extreme — know the box", "back": ["8 HDMI inputs, built-in streaming + recording (USB disk), multiview", "SuperSource for multi-box layouts; upstream/downstream keyers; media pool for graphics", "Controlled and configured via ATEM Software Control", "Say: \"It's a full broadcast switcher in a desktop — perfect for teaching TD.\""], "style": "cues"}, {"id": "C6", "deck": "Tech & Troubleshooting", "front": "ATEM input is black", "back": ["Format/frame-rate mismatch: source must match the switcher's video standard (e.g., 1080p59.94 vs 1080p30)", "Swap HDMI cable; long or cheap cables fail; check EDID handshake/HDCP (HDCP sources won't pass)", "Set the source's output resolution manually instead of auto", "Say: \"Black input is almost always format, cable, or handshake.\""], "style": "cues"}, {"id": "C7", "deck": "Tech & Troubleshooting", "front": "Blackmagic studio cameras: tally, talkback, CCU", "back": ["Return feed/tally & talkback over SDI from the ATEM (or via ATEM camera control)", "CCU: paint iris, white balance, shutter, color from ATEM Software Control or hardware panel", "Match format settings on camera and switcher; set camera IDs correctly so tally hits the right camera", "Say: \"Matched cameras and working tally make a student crew look professional.\""], "style": "cues"}, {"id": "C8", "deck": "Tech & Troubleshooting", "front": "Tally or comms not working", "back": ["Check camera ID/number mapping in switcher vs. camera", "Verify the return SDI/tally cable or network tally path", "Comms: headset, beltpack channel, levels, power; test before doors open", "Fallback: hand signals / stage manager, agreed in the pre-show brief", "Say: \"Comms check is on the rundown — every show, every time.\""], "style": "cues"}, {"id": "C9", "deck": "Tech & Troubleshooting", "front": "Teleprompter issues", "back": ["Text backwards? Mirror/flip the text in prompter software (or on the monitor)", "Check beam-splitter glass: clean, seated at the right angle, hood blocking light", "Scroll control: confirm the controller/foot pedal is paired with prompter software", "iPad prompter apps as a quick backup; [teleprompter model] specifics per manual", "Say: \"Talent should never wonder if the prompter will be there.\""], "style": "cues"}, {"id": "C10", "deck": "Tech & Troubleshooting", "front": "Audio problems: hum, no signal, lav dropout", "back": ["Gain staging: set at the preamp first, faders near unity, peaks well below clipping", "Ground loop hum: isolate (DI/ground-loop isolator), shared power, balanced cables", "No signal on condenser mic: phantom power (+48V) on?", "Lav dropout: fresh batteries, antenna line-of-sight, frequency coordination/scan", "Say: \"Audiences forgive soft video; they won't forgive bad audio.\""], "style": "cues"}, {"id": "C11", "deck": "Tech & Troubleshooting", "front": "Livestream dropping or buffering", "back": ["Bitrate vs. upload: keep stream bitrate well under sustained upload (headroom ~50%)", "Wired connection; test before air; check encoder CPU/dropped frames", "Reboot encoder; re-verify stream key/URL", "Backup encoder + redundant internet (second ISP/hotspot or LiveU bonding)", "Say: \"Every livestream has a plan B before it has a start time.\""], "style": "cues"}, {"id": "C12", "deck": "Tech & Troubleshooting", "front": "Dead air / something fails live", "back": ["Go to slate or bumper immediately; keep audio bed up", "TD switches to a safe wide shot; director calls the recovery", "Fix behind the scenes, then return — log it for the debrief", "Say: \"The audience should see a graphic, not a panic.\""], "style": "cues"}, {"id": "C13", "deck": "Tech & Troubleshooting", "front": "Your tier-1 support approach", "back": ["Document the system: signal flow diagrams, IPs, settings", "Label everything — cables, ports, gear", "Spare cables, batteries, adapters on hand", "Runbooks/checklists students can follow", "Escalate to vendor only after the tier-1 checklist is done — with notes ready", "Say: \"I fix what we can in minutes, and when we call a vendor, we hand them a diagnosis.\""], "style": "cues"}];
const DECKS=["All","Interview Questions","Experience Statements","Tech & Troubleshooting"];
const KEY="canyonsFlashMarks_v1";
let marks={};try{marks=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){marks={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(marks))}catch(e){}};
let deck="All",order=[],pos=0,flipped=false,shuffled=false;
const $=id=>document.getElementById(id);
function pool(){return CARDS.filter(c=>(deck==="All"||c.deck===deck)&&(!$("reviewOnly").checked||marks[c.id]!=="got"))}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rebuild(keep){const curId=order[pos]&&order[pos].id;order=pool();if(shuffled)shuffleArr(order);pos=0;if(keep&&curId){const k=order.findIndex(c=>c.id===curId);if(k>=0)pos=k}render()}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"\x26amp;","<":"\x26lt;",">":"\x26gt;",'"':"\x26quot;"}[m]))}
function markPill(c){const m=marks[c.id];return m==="got"?'<span class="pill got">✓ Got it</span>':m==="rev"?'<span class="pill rev">↻ Review</span>':''}
function render(){
 const card=$("card");card.classList.toggle("flip",false);flipped=false;
 const all=deck==="All"?CARDS:CARDS.filter(c=>c.deck===deck);
 const got=all.filter(c=>marks[c.id]==="got").length,rev=all.filter(c=>marks[c.id]==="rev").length;
 $("stats").textContent=`✓ ${got}  ↻ ${rev}  of ${all.length}`;
 $("progFill").style.width=(all.length?got/all.length*100:0)+"%";
 if(!order.length){$("counter").textContent="00 / 00";$("fDeck").textContent=deck;$("fMark").innerHTML="";$("fText").innerHTML='<div class="empty">No cards here — all marked “Got it”. Uncheck Review-only or Reset marks.</div>';$("bList").innerHTML="";$("bQ").textContent="";return}
 const c=order[pos],p=n=>String(n).padStart(2,"0");
 $("counter").textContent=`${p(pos+1)} / ${p(order.length)}`;
 $("fDeck").textContent=$("bDeck").textContent=c.deck;
 $("fMark").innerHTML=$("bMark").innerHTML=markPill(c);
 $("fText").textContent=c.front;$("bQ").textContent=c.front;
 $("bList").innerHTML=c.back.map(b=>{const say=/^Say: /.test(b);
   if(c.style==="say")return `<li class="say bq">“${esc(b)}”</li>`;
   if(say)return `<li class="say2">${esc(b.replace(/^Say: /,"Say: "))}</li>`;
   return `<li>${esc(b)}</li>`}).join("");
}
function flip(){if(!order.length)return;flipped=!flipped;$("card").classList.toggle("flip",flipped)}
function go(d){if(!order.length)return;pos=(pos+d+order.length)%order.length;render()}
function mark(v){if(!order.length)return;const c=order[pos];marks[c.id]=v;save();
 if($("reviewOnly").checked&&v==="got"){order.splice(pos,1);if(pos>=order.length)pos=0;render()}else go(1)}
$("tabs").innerHTML=DECKS.map(d=>`<button class="tab${d===deck?" on":""}" data-d="${d}">${d} (${d==="All"?CARDS.length:CARDS.filter(c=>c.deck===d).length})</button>`).join("");
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;deck=b.dataset.d;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t===b));rebuild(false)});
$("card").addEventListener("click",flip);$("flipBtn").onclick=flip;
$("prevBtn").onclick=()=>go(-1);$("nextBtn").onclick=()=>go(1);
$("gotBtn").onclick=()=>mark("got");$("revBtn").onclick=()=>mark("rev");
$("shuffleBtn").onclick=()=>{shuffled=true;rebuild(false)};$("orderBtn").onclick=()=>{shuffled=false;rebuild(false)};
$("reviewOnly").onchange=()=>rebuild(true);
$("resetBtn").onclick=()=>{if(confirm("Clear all Got it / Review marks?")){marks={};save();rebuild(true)}};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;const k=e.key;
 if(k===" "||k==="Enter"){e.preventDefault();flip()}else if(k==="ArrowRight"){go(1)}else if(k==="ArrowLeft"){go(-1)}
 else if(k==="g"||k==="G"){mark("got")}else if(k==="r"||k==="R"){mark("rev")}else if(k==="s"||k==="S"){shuffled=true;rebuild(false)}});
let tx=null;$("card").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
$("card").addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60){e.preventDefault();go(dx<0?1:-1)}});
rebuild(false);
</script></body></html>
